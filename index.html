<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Super Fart Bros 3</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23101018'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%238fe04a'/%3E%3Crect x='5' y='6' width='2' height='2' fill='%23101018'/%3E%3Crect x='9' y='6' width='2' height='2' fill='%23101018'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">

  <!--
    Link preview card. The image is generated from the game itself by
    tools/make-card.mjs, so it never drifts from what the game looks like.
    Absolute URLs are required: Slack and the rest fetch these from their own
    servers, where a relative path means nothing.
  -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Super Fart Bros 3">
  <meta property="og:title" content="Super Fart Bros 3">
  <meta property="og:description" content="Selaimessa pyörivä tasohyppely: viisiportaiset tehostukset, ummetuskorkkeja, närästysliekkejä ja PIERUPRINSSI. Ei asennusta.">
  <meta property="og:url" content="https://sfb3.vercel.app/">
  <meta property="og:image" content="https://sfb3.vercel.app/card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Super Fart Bros 3 -pelin alkuruutu">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Super Fart Bros 3">
  <meta name="twitter:description" content="Selaimessa pyörivä tasohyppely. Ei asennusta, ei riippuvuuksia.">
  <meta name="twitter:image" content="https://sfb3.vercel.app/card.png">
  <meta name="description" content="Selaimessa pyörivä tasohyppely: viisiportaiset tehostukset, ummetuskorkkeja ja PIERUPRINSSI.">
  <meta name="theme-color" content="#101830">
</head>
<body>
  <div id="shell">
    <canvas id="game" width="320" height="240"></canvas>
    <div id="hint">
      <span><b>&larr; &uarr; &darr; &rarr;</b> tai <b>WASD</b> liiku</span>
      <span><b>Z</b> / <b>L</b> / <b>väli</b> hyppy</span>
      <span><b>X</b> / <b>K</b> juoksu / pieru</span>
      <span><b>Enter</b> valitse / tauko</span>
      <span><b>M</b> mykistys</span>
      <span><b>1</b> tallenna tila</span>
      <span><b>2</b> lataa tila</span>
      <span><b>3</b> vaihda paikkaa</span>
      <span><b>7</b> kuvaefektit</span>
      <span><b>9</b> debug</span>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
